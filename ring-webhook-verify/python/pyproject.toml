[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ring-webhook-verify"
version = "0.1.0"
description = "Lightweight HMAC-SHA256 signature verification for Ring Partner API webhooks."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Porchlight Contributors" }]
keywords = ["ring", "webhook", "hmac", "security", "smart-home", "partner-api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
